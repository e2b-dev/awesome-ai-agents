name: README integrity

on:
  pull_request:
    paths:
      - README.md
      - scripts/check_readme.py
      - tests/test_readme.py
      - .github/workflows/readme-check.yml
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run README integrity tests
        run: python -m unittest discover -s tests -v
      - name: Validate the catalog README
        run: python scripts/check_readme.py
